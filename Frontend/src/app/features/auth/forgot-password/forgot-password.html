<div class="login-wrapper">
  <div class="card login-card shadow">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <img src="Logo_Acme_Catalogo.jpg" alt="ACME Logo" width="120" height="120" />
        <h2 class="h4 mt-2">Recuperar contraseña</h2>
        <p class="text-muted">
          Ingresa tu correo y te enviaremos un enlace para restablecerla.
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="enviar()">
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="usuario@acme.cl"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <small class="text-danger">Ingresa un correo válido.</small>
          }
        </div>

        @if (mensaje()) {
          <div class="alert alert-success py-2">{{ mensaje() }}</div>
        }
        @if (error()) {
          <div class="alert alert-danger py-2">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
        </button>
      </form>

      <div class="text-center mt-3">
        <a routerLink="/login" class="small">Volver al inicio de sesión</a>
      </div>
    </div>
  </div>
</div>
