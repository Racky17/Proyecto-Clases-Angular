<nav class="navbar navbar-expand navbar-dark bg-primary">
    <a class="navbar-brand" href="#">
        <img src="Logo_Acme_Catalogo.jpg" alt="ACME Logo" width="200" height="200">
    </a>
    <div>
        <h1 id="titulo">{{ title() }}</h1>
    </div>
</nav>
<div class="card">
    <div class="card-body">
        <div class="row">
            <div class="col-md-2">filtrar por:</div>
            <div class="col-lg-2">
                <input type="text" 
                    [value]="listFilter()" 
                    (input)="listFilter.set($any($event.target).value)" 
                    placeholder="Filtrar por...">
            </div>
            <div class="col-md-8">
                <p>Filtrando por: {{ listFilter() }}</p>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary" (click)="toggleChildren()">
                    <i class="bi bi-eye"></i>
                    {{ showChildren() ? 'Ocultar' : 'Mostrar' }} Hijo                                         
                </button>
            </div>
        </div>
        @if (showChildren()){
        <app-product-list [datos]="filteredProducts()"></app-product-list>
        }
    </div>
</div>
